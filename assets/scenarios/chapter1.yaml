  # ─── 3. 徴税所・メインシーン (main) ─────────────────────
  - id: town
    background: main
    transition_in: fade

    dialogues:
      - text: "（夕暮れの徴税所。窓口に最後の客が座った）"
      - 商人: "エルドブ商会の者です。今期の納税に参りました。"
      - アル: "硫黄採掘の許可証を拝見します。"
      - 商人: "こちらに。番号は1A235、期限もまだ先のはずです。"
      - アル: "……確かに。では元帳と照らし合わせます。"
      - text: "（棚から4235番の元帳を取り出し、ページをめくる）"
      - アル: "今期の採掘高は、前期の半分ほどですね。"
      - 商人: "ええ、鉱脈が細りましてね。お察しください。"
      - アル: "ですが運送費は倍に増えている。何を運んだのです？"
      - 商人: "……それは、その。"
      - アル: "申告と帳簿が合わない分、追徴させていただきます。"
      - 商人: "ご勘弁を！　払えば村の者が冬を越せません！"
      - アル: "……税は税です。決まりは曲げられない。"
      - text: "（インク壺にペンを浸す手が、わずかに止まった）"

    next:
      scene: sorrow
      transition_out: wipe_up

  # ─── 4. 涙・悲しみのシーン (tear) ──────────────────────
  - id: sorrow
    background: tear
    transition_in: wipe_up

    dialogues:
      - アル: "うっ……頭が……！"
      - 少女: "……お願い、忘れないで。"
      - アル: "誰だ！？　君は誰なんだ！？"
      - 少女: "いつか必ず、思い出して……。"
      - narrator: "アルの頬を、一筋の涙が伝った。"
      - narrator: "彼が失った記憶のピースは、まだ見つからない。"
